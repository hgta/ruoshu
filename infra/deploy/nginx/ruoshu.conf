# 若书 · 主站 nginx（任务 13.5/13.7）
# 部署：cp infra/deploy/nginx/ruoshu.conf /etc/nginx/sites-available/ruoshu && ln -s ../sites-available/ruoshu /etc/nginx/sites-enabled/
# 双机：本配置同装两台，upstream 内两台互为主备（本机 127.0.0.1:9000 + 对端 10.0.0.12:9000）

# 登录/注册/举报防刷（任务 13.7 限流；Nginx 层第一道，应用层还有 throttle）
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=report_zone:10m rate=5r/m;

upstream ruoshu_fpm {
    server 127.0.0.1:9000;          # php-fpm（本机）
    server 10.0.0.12:9000 backup;    # 对端（读写库共享，可接管）
}

upstream ruoshu_realtime {
    ip_hash;                          # WS 粘连（连接级，不要求会话级）
    server 127.0.0.1:8080;
    server 10.0.0.12:8080;
}

upstream ruoshu_ai {
    server 127.0.0.1:9001;           # ai-python systemd 监听（生产改内网端口）
    server 10.0.0.12:9001 backup;
}

server {
    listen 80;
    server_name ruoshu.example.com www.ruoshu.example.com;
    # 生产：listen 443 ssl http2; + 证书（certbot --nginx）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ruoshu.example.com;

    # ssl_certificate /etc/letsencrypt/live/ruoshu.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ruoshu.example.com/privkey.pem;

    root /srv/ruoshu/current/web/public;
    index index.php;
    client_max_body_size 8m;         # 章节上传上限（任务 4.2）

    # 静态直出 + 长缓存（附件 ZIP 导出 72h，storage 软链）
    location /storage/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # WebSocket（弹幕/打赏广播）
    location /ws {
        proxy_pass http://ruoshu_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;    # 长连接保活
    }

    # AI 服务仅内网转发（指纹/水印，不暴露公网；正常走 Laravel 内部 HTTP 客户端，此处留运维排障口）
    location /internal/ai/ {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://ruoshu_ai/;
    }

    # 登录/注册/举报：限流加严
    location ~ ^/(login|register|report)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        include snippets/ruoshu-php.conf;
    }
    location = /report {
        limit_req zone=report_zone burst=2 nodelay;
        include snippets/ruoshu-php.conf;
    }

    # API（阅读门禁轮询等）
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        include snippets/ruoshu-php.conf;
    }

    # 健康探针：直连本机 fpm，绕限流（LB 探测高频）
    location ~ ^/(healthz|readyz)$ {
        access_log off;
        include snippets/ruoshu-php.conf;
    }

    location / {
        include snippets/ruoshu-php.conf;
    }

    # 支付回调：仅微信/支付宝出口 IP（生产替换为官方 IP 段；13.7 验签 + IP 双闸）
    location ~ ^/pay/.+/callback$ {
        # allow 101.226.0.0/16; ... (微信出口段)
        # deny all;
        include snippets/ruoshu-php.conf;
    }
}
