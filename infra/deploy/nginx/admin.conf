# 若书 · 管理后台独立子域（任务 12.1/13.7）
# 与主站隔离：IP 白名单（网关层）+ Basic Auth（传输层）+ 应用层 can:admin & EnsureAdminAccess = 三闸
# 不带 cookie 域：admin 独立域不共享主站 session cookie（域隔离，cookie 范围见 SESSION_DOMAIN）

limit_req_zone $binary_remote_addr zone=admin_zone:1m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name admin.ruoshu.example.com;

    # ssl_certificate /etc/letsencrypt/live/admin.ruoshu.example.com/fullchain.pem;

    root /srv/ruoshu/current/web/public;

    # 闸 1：办公室/VPN 出口白名单（网关层，生产替换真实网段）
    allow 203.0.113.0/24;    # 办公出口
    allow 10.0.0.0/8;        # 内网/VPN
    deny all;

    # 闸 2：运维 Basic Auth（每人独立账号，审计在应用层 audit_logs）
    auth_basic "ruoshu-admin";
    auth_basic_user_file /etc/nginx/htpasswd-ruoshu;

    limit_req zone=admin_zone burst=10 nodelay;

    location / {
        include snippets/ruoshu-php.conf;
    }
}
