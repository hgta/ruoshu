# 若书 · 宝塔面板 vhost 追加片段（CentOS8 + 宝塔11 + PHP 8.3）
#
# 用法：宝塔面板 → 网站 → 设置 → 配置文件，把本文件内容粘贴到 server{} 内（替换或追加 location 段）
#      或保存为 /www/server/panel/vhost/nginx/ruoshu-locations.conf 后在主 vhost 里 include。
#
# 与通用版差异：
#   1. fastcgi_pass 用宝塔 socket：/tmp/php-cgi-83.sock（非 127.0.0.1:9000）
#   2. 站点根：/www/wwwroot/ruoshu/current/web/public
#   3. 不写 listen / ssl —— 由宝塔生成的 vhost 与 Let's Encrypt 证书接管

# ===== 静态与导出包（storage 软链，72h 签名）=====
location /storage/ {
    expires 1h;
    add_header Cache-Control "public";
}

# ===== WebSocket（弹幕 / 打赏广播，Go realtime 127.0.0.1:8080）=====
location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}

# ===== 健康探针（LB / 监控，关日志免刷屏；内联转发，不嵌套 location）=====
location ~ ^/(healthz|readyz)$ {
    access_log off;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    include fastcgi_params;
}

# ===== PHP 转发（宝塔 socket）=====
location / {
    try_files $uri /index.php?$query_string;
}

location ~ \.php$ {
    fastcgi_pass unix:/tmp/php-cgi-83.sock;   # 宝塔 PHP 8.3；用 ls /tmp/php-cgi-*.sock 确认
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_hide_header X-Powered-By;
    fastcgi_buffering off;                    # 弹幕/流式首字节尽快出
    fastcgi_read_timeout 120s;
}

# ===== 拒绝敏感文件（.env / .git）=====
location ~ /\.(?!well-known) {
    deny all;
}
